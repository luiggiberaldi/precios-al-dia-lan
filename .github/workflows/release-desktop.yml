name: Release Desktop Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Build y publicar .exe Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Verificar si el release ya fue publicado
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "latest.yml"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check_release.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check_release.outputs.skip != 'true'
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        if: steps.check_release.outputs.skip != 'true'
        with:
          bun-version: 1.3.14

      - name: Instalar dependencias raíz
        if: steps.check_release.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Instalar dependencias desktop
        if: steps.check_release.outputs.skip != 'true'
        working-directory: desktop
        run: npm ci

      - name: Compilar frontend Electron
        if: steps.check_release.outputs.skip != 'true'
        env:
          ELECTRON_BUILD: 'true'
          VITE_NUBE_ACCOUNTS: 'true'
          VITE_LAN_MODE: 'true'
          VITE_LAN_CLOUD_URL: ${{ vars.VITE_LAN_CLOUD_URL }}
          VITE_LAN_CLOUD_KEY: ${{ vars.VITE_LAN_CLOUD_KEY }}
        run: bun run build

      - name: Verificar sin llaves heredadas
        if: steps.check_release.outputs.skip != 'true'
        run: node scripts/nube/check-no-legacy-supabase.mjs dist

      - name: Preparar dist-web para app.asar
        if: steps.check_release.outputs.skip != 'true'
        run: node scripts/lan/prepare-desktop.mjs

      - name: Empaquetar y publicar en GitHub Releases
        if: steps.check_release.outputs.skip != 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
