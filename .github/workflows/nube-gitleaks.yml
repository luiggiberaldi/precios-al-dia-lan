# Precios al Día Nube · baranda G1: ninguna llave en el código.
#
# Corre gitleaks (imagen oficial) en cada PR y en cada push a main:
#   1. sobre los archivos actuales del repo (sin node_modules ni dist);
#   2. en un PR, además, sobre los commits nuevos del PR.
# Si encuentra algo, el check queda en rojo y no se une.
#
# Excepciones justificadas: .gitleaks.toml (cada una con su motivo).

name: Gitleaks (nube)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks · sin llaves en el código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archivos actuales
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

      - name: Commits nuevos del PR
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --log-opts="origin/${{ github.base_ref }}..HEAD"
